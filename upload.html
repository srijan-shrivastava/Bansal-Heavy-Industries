<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BHI — Trip Documents</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#232326">
<style>
  :root{
    --dark:#232326; --orange:#F25505; --grid:#e2e3e3; --head:#f8f9fa;
    --txt:#202124; --muted:#5f6368; --green:#0f9d58; --red:#d93025;
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font:15px/1.45 -apple-system,Roboto,Arial,sans-serif;color:var(--txt);
       background:#f1f3f4;padding-bottom:104px}
  header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;
         position:sticky;top:0;z-index:10}
  header h1{font-size:15px;margin:0;font-weight:600;flex:1}
  header .sub{font-size:11px;opacity:.7;display:block;font-weight:400}
  .progress{background:#fff;padding:10px 16px;border-bottom:1px solid var(--grid);
            position:sticky;top:52px;z-index:9;font-size:13px;color:var(--muted)}
  .progress b{color:var(--txt)}
  .track{height:4px;background:var(--grid);border-radius:2px;margin-top:7px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}

  .card{background:#fff;margin:10px;border-radius:10px;overflow:hidden;
        box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .card.done{box-shadow:0 0 0 2px var(--green),0 1px 3px rgba(0,0,0,.12)}
  .chead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--grid)}
  .truck{background:var(--dark);color:#fff;font-weight:700;font-size:12px;
         padding:4px 9px;border-radius:5px;white-space:nowrap}
  .meta{flex:1;min-width:0}
  .meta .l1{font-weight:600;font-size:14px}
  .meta .l2{font-size:12px;color:var(--muted);margin-top:1px}
  .tick{font-size:19px;color:var(--grid)}
  .card.done .tick{color:var(--green)}

  .doneline{font-size:12.5px;color:var(--green);padding:12px 14px;font-weight:600;
        display:flex;align-items:center;gap:7px}
  .doneline::before{content:'\2713';font-size:14px}
  .allset{padding:14px 16px;text-align:center;font-size:13px;color:var(--green);
        font-weight:600}
  .allset span{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}
  .shots{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
  .thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;background:var(--head)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb em{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);
        color:#fff;font-size:10px;font-style:normal;text-align:center;padding:1px 0}
  .thumb.pending img{opacity:.45}
  .thumb.pending em{background:var(--orange)}
  .thumb.pending::after{content:'';position:absolute;top:50%;left:50%;width:20px;height:20px;
        margin:-10px 0 0 -10px;border:2px solid rgba(255,255,255,.4);
        border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .thumb.failed img{opacity:.3}
  .thumb.failed em{background:var(--red)}
  .thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;
        border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:14px;line-height:22px;
        padding:0;cursor:pointer}
  .add{width:76px;height:76px;border:2px dashed var(--grid);border-radius:8px;background:#fff;
       color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:3px;cursor:pointer;font-family:inherit}
  .add span{font-size:21px;line-height:1;color:var(--orange)}
  .add:active{background:var(--head)}
  input[type=file]{display:none}

  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--grid);
       padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:10}
  .bar button{width:100%;padding:14px;border:none;border-radius:9px;background:var(--green);
       color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .bar button:disabled{background:#c8cbcd}
  .note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
  .note.err{color:var(--red)} .note.ok{color:var(--green)}

  .state{padding:56px 28px;text-align:center;color:var(--muted)}
  .state h2{font-size:16px;color:var(--txt);margin:0 0 8px}

  .closed{padding:48px 28px;text-align:center;color:var(--muted)}
  .closed .big{width:56px;height:56px;line-height:56px;margin:0 auto 18px;
        border-radius:50%;background:var(--green);color:#fff;font-size:28px}
  .closed h2{font-size:17px;color:var(--txt);margin:0 0 6px;font-weight:600}
  .closed p{font-size:13px;margin:0 auto 20px;max-width:270px;line-height:1.5}
  .closed .facts{background:#fff;border-radius:10px;padding:14px 16px;
        display:inline-block;text-align:left;font-size:13px;line-height:1.9;
        box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .closed .facts b{color:var(--txt)}
  .closed .small{font-size:11.5px;margin-top:20px;max-width:260px}
</style>

<header>
  <svg viewBox="0 0 114 91" width="28" height="22" aria-hidden="true">
    <path d="M49.5,0 H64.5 L114,91 H91.2 L57,29.1 L22.8,91 H0 Z" fill="#fff"/>
    <path d="M57,55 L76,91 H39 Z" fill="#F25505"/>
  </svg>
  <h1>Trip Documents<span class="sub" id="sub">loading…</span></h1>
</header>

<div class="progress" id="prog" hidden>
  <span id="progText">Loading&hellip;</span>
  <span id="pShots" style="float:right"></span>
  <div class="track"><i id="pBar"></i></div>
</div>

<div id="list"><div class="state">Loading your trips…</div></div>

<div class="bar" hidden id="bar">
  <button id="send" disabled>Upload photos</button>
  <div class="note" id="note">Photos stay on your phone until you tap Upload.</div>
</div>

<script src="pdf.min.js"></script>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzGSlQalJ6YgpFOkvBMNxMYML3l7nQlYIhX0ADMHoys2qXBd3xxcqRbL4va3UyQVoRJ/exec';

const QS    = new URLSearchParams(location.search);
const BATCH = QS.get('b') || '';

/* The access code, carried through from the QR link. doPost gates photo
   uploads exactly like log writes, so without this every upload is rejected
   with 'code missing' before it ever reaches Drive. Kept per device too, so a
   reopened link still works after the QR tab is gone. */
let ACCESS_CODE = QS.get('k') || localStorage.getItem('bhi_code') || '';
if (QS.get('k')) {
  try { localStorage.setItem('bhi_code', QS.get('k')); } catch (_) {}
}
let TRIPS = [];                 // rows from the sheet
const SHOTS = {};               // rowNumber -> [{id, dataUrl, name}]

/* ---------- fetch the batch ---------- */
/* JSONP with a timeout that does not leave a landmine behind.

   The old version deleted window[cb] the moment it gave up. Apps Script cold
   starts can take longer than the timeout, so the response would arrive
   afterwards, call a function that no longer existed, and throw
   "ReferenceError: cb... is not defined" into the console. Worse, the page
   had already decided it was offline and said so while showing stale figures.

   Now: the callback is replaced by a no-op rather than deleted, the script
   tag is cleaned up late, and the window is long enough for a cold start. */
function jsonp(params){
  return new Promise((resolve, reject) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const el = document.createElement('script');

    const retire = () => {
      window[cb] = () => {};
      setTimeout(() => { try { delete window[cb]; } catch(_){} }, 60000);
      el.remove();
    };

    const timer = setTimeout(() => { retire(); reject(new Error('timeout')); }, 45000);
    window[cb] = d => { clearTimeout(timer); retire(); resolve(d); };
    el.onerror = () => { clearTimeout(timer); retire(); reject(new Error('failed')); };
    el.src = ENDPOINT + '?' + params + '&callback=' + cb +
             (ACCESS_CODE ? '&k=' + encodeURIComponent(ACCESS_CODE) : '');
    document.head.appendChild(el);
  });
}

async function load(){
  if (!BATCH){
    document.getElementById('list').innerHTML =
      `<div class="state"><h2>No batch selected</h2>
       Scan the QR code shown on the computer after submitting the day's entries.</div>`;
    document.getElementById('sub').textContent = '';
    return;
  }
  let res;
  try{
    res = await jsonp('action=batch&b=' + encodeURIComponent(BATCH));
  }catch(err){
    document.getElementById('list').innerHTML =
      `<div class="state"><h2>Could not load</h2>
       Check your internet connection, then pull down to refresh.</div>`;
    document.getElementById('sub').textContent = '';
    return;
  }

  /* Drawing is a separate try. Lumping it in with the fetch meant any render
     bug was reported as "check your internet connection", which sent us
     looking in the wrong place entirely. */
  try{
    TRIPS = (res && res.trips) || [];
    if (!TRIPS.length){
      document.getElementById('list').innerHTML =
        `<div class="state"><h2>No trips found</h2>
         This batch has no Daily Trip Log entries, or the link has expired.</div>`;
      document.getElementById('sub').textContent = BATCH;
      return;
    }
    document.getElementById('sub').textContent =
      TRIPS[0].date + ' · ' + (res.filledBy || '') + ' · ' + BATCH;

    /* Re-scanning a finished QR used to reopen the cards, which invited
       re-uploading over documents already filed. A batch where every trip has
       a PDF is closed: say so plainly and offer nothing to tap. */
    if (TRIPS.every(t => t.photoUrl)){
      showClosed(res);
      return;
    }

    render();
  }catch(err){
    console.error('render failed', err);
    document.getElementById('list').innerHTML =
      `<div class="state"><h2>Something went wrong</h2>
       ${esc(String(err && err.message || err))}
       <br><br>Send this message to the office.</div>`;
  }
}

/** This batch is finished. Nothing to add, nothing to overwrite. */
function showClosed(res){
  const trucks = [...new Set(TRIPS.map(t => t.truck).filter(Boolean))].join(', ');
  document.getElementById('prog').hidden = true;
  document.getElementById('bar').hidden = true;
  document.getElementById('list').innerHTML = `
    <div class="closed">
      <div class="big">&#10003;</div>
      <h2>Already uploaded</h2>
      <p>Documents for this batch were filed and cannot be changed here.</p>
      <div class="facts">
        <div><b>${TRIPS.length}</b> trip${TRIPS.length > 1 ? 's' : ''}</div>
        <div><b>${esc(TRIPS[0].date)}</b></div>
        ${trucks ? `<div><b>${esc(trucks)}</b></div>` : ''}
        ${res && res.filledBy ? `<div>entered by <b>${esc(res.filledBy)}</b></div>` : ''}
      </div>
      <p class="small">If a photo needs replacing, ask the office &mdash; the
         file is in Drive under this trip's date and truck.</p>
    </div>`;
}

/* ---------- render ---------- */
function render(){
  const list = document.getElementById('list');
  list.innerHTML = TRIPS.map(t => {
    const shots = SHOTS[t.row] || [];
    return `
      <div class="card ${(shots.length || t.photoUrl) ? 'done' : ''}" data-row="${t.row}">
        <div class="chead">
          <span class="truck">${esc(t.truck || '—')}</span>
          <div class="meta">
            <div class="l1">Trip ${esc(t.tripNo || '?')} · Slip ${esc(t.slip || '—')}</div>
            <div class="l2">${esc(t.client || '')} · ${esc(t.shift || '')} · ${esc(t.tonnes || '')} t</div>
          </div>
          <span class="tick">${t.photoUrl ? '✓' : (shots.length ? '●' : '○')}</span>
        </div>
        ${t.photoUrl
          /* Done. No link — he has no access to the Drive folder, so offering
             one is a dead end. No picker either: this trip's documents are
             filed, and re-adding would only overwrite them. */
          ? `<div class="doneline">Documents uploaded</div>`
          : `<div class="shots">
          ${shots.map(s => `
            <div class="thumb${s.pending ? ' pending' : ''}${s.failed ? ' failed' : ''}">
              <img src="${s.dataUrl}" alt="">
              <em>${s.pending ? 'saving\u2026'
                    : s.failed ? 'failed'
                    : Math.round((s.bytes || 0) / 1024) + 'KB'}</em>
              <button data-del="${s.id}" data-row="${t.row}" aria-label="Remove">×</button>
            </div>`).join('')}
          <button class="add" data-add="${t.row}"><span>+</span>Add photo</button>
        </div>`}
      </div>`;
  }).join('') +
  `<input type="file" id="picker" accept="image/*" capture="environment" multiple>`;

  const uploaded = TRIPS.filter(t => t.photoUrl).length;
  const allDone = uploaded === TRIPS.length;

  const done = TRIPS.filter(t => t.photoUrl || (SHOTS[t.row] || []).length).length;
  const total = TRIPS.reduce((s, t) => s + (SHOTS[t.row] || []).length, 0);
  document.getElementById('prog').hidden = false;

  // Every trip filed: nothing left to do on this batch, so the button goes.
  document.getElementById('bar').hidden = allDone;
  if (allDone){
    list.insertAdjacentHTML('beforeend',
      '<div class="allset">All documents uploaded for this batch.' +
      '<span>You can close this page.</span></div>');
  }
  /* One write for the whole line. An earlier version set #pDone, then
     replaced the span's innerHTML (destroying #pDone and #pTotal), then tried
     to set #pTotal — which by then was null, and the thrown error surfaced as
     a bogus "check your internet connection". */
  document.getElementById('progText').innerHTML = allDone
    ? '<b>All ' + TRIPS.length + '</b> trip' + (TRIPS.length > 1 ? 's' : '') + ' uploaded'
    : '<b>' + done + '</b> of <b>' + TRIPS.length + '</b> trips have photos';
  document.getElementById('pShots').textContent = total ? total + ' photo' + (total > 1 ? 's' : '') : '';
  document.getElementById('pBar').style.width = (done / TRIPS.length * 100) + '%';
  // Uploading while a photo is still compressing would send it without its
  // bytes, so the button waits.
  const ready = TRIPS.reduce((s, t) =>
    s + (SHOTS[t.row] || []).filter(x => !x.pending && !x.failed).length, 0);
  const btn = document.getElementById('send');
  if (allDone) return;
  btn.disabled = !ready || busy > 0;
  btn.textContent = busy > 0
    ? `Processing ${busy} photo${busy > 1 ? 's' : ''}\u2026`
    : ready ? `Upload ${ready} photo${ready > 1 ? 's' : ''}` : 'Upload photos';
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------- picking photos ----------

   Three things went wrong on Android and all three are fixed here.

   1. WRONG ROW. `pickRow` was a module variable read AFTER the await inside
      the change handler. Tapping "Add photo" on the next trip while the last
      one was still compressing overwrote it, so the photo landed on the
      wrong card. The row is now stamped on the input element and read
      synchronously, before anything can yield.

   2. NOTHING APPEARS. Compressing a 12MP photo takes a second or two on a
      phone — decode, draw to canvas, then up to four JPEG encodes. Until it
      finished, nothing was drawn, so a tap looked like it had done nothing
      and the picture only showed up when the NEXT one triggered a redraw.
      A placeholder thumbnail now appears the instant the file is chosen and
      is swapped for the real one when compression finishes.

   3. SILENTLY LOST. `catch(_){}` swallowed failures whole. A photo that
      failed to compress vanished with no message. Failures now surface on
      the card.
*/

let busy = 0;

document.addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  if (add){
    const p = document.getElementById('picker');
    p.value = '';
    p.dataset.row = add.dataset.row || add.dataset.add;   // stamped, not shared
    p.click();
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del){
    const row = del.dataset.row;
    SHOTS[row] = (SHOTS[row] || []).filter(s => s.id !== del.dataset.del);
    if (!SHOTS[row].length) delete SHOTS[row];
    render();
  }
});

document.addEventListener('change', async e => {
  if (e.target.id !== 'picker') return;

  // Read both BEFORE any await — the input is reused for the next tap.
  const row = e.target.dataset.row;
  const files = [...e.target.files];
  if (!row || !files.length) return;

  // Placeholders first, so the tap has a visible result immediately.
  const pending = files.map(f => {
    const item = {
      id: 's' + Math.random().toString(36).slice(2),
      name: f.name || 'photo.jpg',
      dataUrl: URL.createObjectURL(f),   // the camera file, shown as-is
      pending: true, bytes: f.size
    };
    (SHOTS[row] = SHOTS[row] || []).push(item);
    return { item: item, file: f };
  });
  busy += pending.length;
  render();

  // Then compress one at a time. Running them in parallel makes a phone
  // swap and can crash the tab on a big batch.
  for (const job of pending){
    try {
      const shot = await shrink(job.file);
      URL.revokeObjectURL(job.item.dataUrl);
      job.item.dataUrl = shot.dataUrl;
      job.item.bin = shot.bin;
      job.item.w = shot.w;
      job.item.h = shot.h;
      job.item.bytes = shot.bytes;
      delete job.item.pending;
    } catch (err){
      job.item.failed = true;
      delete job.item.pending;
    }
    busy--;
    render();
  }
});

/* ---------- adaptive JPEG compression ----------
   Size is dominated by the JPEG encode; the PDF wrapper adds about 1KB a page.
   Three things keep bytes down without visible loss:

   1. Quality is searched, not fixed. A flat 0.82 wastes bytes on a plain
      weighbridge slip and starves a detailed tipper shot. We binary-search
      quality to hit a bits-per-pixel budget, so each photo gets what it needs.
   2. Re-encoding is skipped when it would not help. If the camera file is
      already smaller than our target and within the pixel limit, the original
      bytes go straight into the PDF — no generational loss at all.
   3. Long edge capped at 2000px, which keeps slip digits crisp even when
      zoomed. Canvas also drops EXIF, saving a few KB per photo.
*/

/* Deliberately set for high fidelity rather than smallest files: a
   weighbridge slip is a legal document and legibility wins over bytes.

   Budget is BYTES per pixel (the constant used to be called TARGET_BPP and
   documented as bits, which was simply wrong). 2000x1500 = 3MP, so 0.11
   targets roughly 330KB a photo and about 1.5MB for a five-page PDF.

   Lower BYTES_PER_PX to 0.06 if uploads ever get slow on a weak signal —
   that roughly halves the size, at a measured SSIM cost of about 0.02. */
const MAX_EDGE      = 2000;
const BYTES_PER_PX  = 0.11;
const Q_MIN         = 0.62;
const Q_MAX         = 0.90;

const readAsDataUrl = file => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onerror = rej;
  fr.onload = () => res(fr.result);
  fr.readAsDataURL(file);
});

const loadImage = src => new Promise((res, rej) => {
  const img = new Image();
  img.onerror = rej;
  img.onload = () => res(img);
  img.src = src;
});

const blobToBinary = blob => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onerror = rej;
  fr.onload = () => {
    const b = new Uint8Array(fr.result);
    let out = '';
    for (let i = 0; i < b.length; i += 0x8000){
      out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    }
    res(out);
  };
  fr.readAsArrayBuffer(blob);
});

const encode = (canvas, q) =>
  new Promise(res => canvas.toBlob(res, 'image/jpeg', q));

async function shrink(file){
  const dataUrl = await readAsDataUrl(file);
  const img = await loadImage(dataUrl);

  let w = img.naturalWidth, h = img.naturalHeight;
  const needsResize = (w > MAX_EDGE || h > MAX_EDGE);
  if (needsResize){
    const k = MAX_EDGE / Math.max(w, h);
    w = Math.round(w * k); h = Math.round(h * k);
  }

  const targetBytes = Math.round(w * h * BYTES_PER_PX);

  // Already small enough and no resize needed? Use the camera's own bytes.
  // Re-encoding here would only lose detail and often gain nothing.
  if (!needsResize && file.size <= targetBytes * 1.15){
    return {
      bin: await blobToBinary(file),
      dataUrl, w, h, bytes: file.size, reused: true
    };
  }

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);

  // Binary-search quality toward the byte budget. Four probes lands within a
  // few percent, and stops early once close enough.
  let lo = Q_MIN, hi = Q_MAX, best = null;
  for (let i = 0; i < 4; i++){
    const q = (lo + hi) / 2;
    const blob = await encode(c, q);
    if (!blob) break;
    if (!best || (blob.size <= targetBytes && blob.size > best.size) ||
        (best.size > targetBytes && blob.size < best.size)){
      best = blob; best.q = q;
    }
    const ratio = blob.size / targetBytes;
    if (ratio > 0.92 && ratio < 1.08) break;   // close enough
    if (blob.size > targetBytes) hi = q; else lo = q;
  }

  if (!best) best = await encode(c, 0.8);

  // If all that effort beat the original by less than 5%, keep the original.
  if (!needsResize && file.size < best.size * 1.05){
    return { bin: await blobToBinary(file), dataUrl, w, h,
             bytes: file.size, reused: true };
  }

  return {
    bin: await blobToBinary(best),
    dataUrl: c.toDataURL('image/jpeg', 0.5),   // small preview only, not stored
    w, h, bytes: best.size, reused: false
  };
}

/* ---------- build one PDF per trip, upload each to Drive ---------- */

const binToB64 = bin => {
  let out = '', chunk = 0x8000;
  for (let i = 0; i < bin.length; i += chunk){
    out += String.fromCharCode.apply(null,
      Array.from(bin.slice(i, i + chunk), c => c.charCodeAt(0) & 0xff));
  }
  return btoa(out);
};

function pdfForTrip(trip, shots){
  const images = shots.map(s => ({
    bin: s.bin,
    w: s.w, h: s.h,
    caption: [trip.truck, 'Trip ' + (trip.tripNo || '?'),
              'Slip ' + (trip.slip || '-'), trip.date,
              trip.client].filter(Boolean).join('  |  ')
  }));
  return binToB64(buildPdfFromJpegs(images));
}

function post(body){
  body.code = ACCESS_CODE;          // required by doPost's access gate
  return fetch(ENDPOINT, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
}

document.getElementById('send').onclick = async () => {
  const btn = document.getElementById('send'), note = document.getElementById('note');
  // Drop anything still compressing or broken; only complete photos go up.
  Object.keys(SHOTS).forEach(r => {
    SHOTS[r] = SHOTS[r].filter(x => x.bin && !x.pending && !x.failed);
    if (!SHOTS[r].length) delete SHOTS[r];
  });
  const rows = Object.keys(SHOTS).filter(r => SHOTS[r].length);
  if (!rows.length) return;

  btn.disabled = true;
  note.className = 'note';

  let sent = 0;
  for (const row of rows){
    const trip = TRIPS.find(t => String(t.row) === String(row)) || { row: Number(row) };
    note.textContent = 'Building PDF ' + (sent + 1) + ' of ' + rows.length + '\u2026';
    let pdfB64;
    try {
      pdfB64 = pdfForTrip(trip, SHOTS[row]);
    } catch (err){
      note.className = 'note err';
      note.textContent = 'Could not build the PDF for trip ' + (trip.tripNo || row) + '.';
      btn.disabled = false;
      return;
    }

    note.textContent = 'Uploading ' + (sent + 1) + ' of ' + rows.length +
                       ' (' + (pdfB64.length / 1398101).toFixed(1) + ' MB)\u2026';
    try {
      // One request per trip keeps each well under Apps Script's size cap.
      await post({
        kind: 'photos',
        batchId: BATCH,
        row: Number(row),
        pages: SHOTS[row].length,
        trip: trip,
        pdfBase64: pdfB64
      });
      sent++;
    } catch (err){
      note.className = 'note err';
      note.textContent = 'Upload failed at trip ' + (trip.tripNo || row) +
                         '. Reconnect and tap Upload again.';
      btn.disabled = false;
      return;
    }
  }

  // no-cors gives no response, so confirm by re-reading the batch. Drive
  // writes can lag a few seconds, so poll rather than checking once.
  let saved = 0, res = null;
  for (let attempt = 1; attempt <= 6; attempt++){
    note.className = 'note';
    note.textContent = 'Saving to Drive, checking\u2026';
    await new Promise(r => setTimeout(r, attempt === 1 ? 3000 : 4000));
    try {
      res = await jsonp('action=batch&b=' + encodeURIComponent(BATCH));
      saved = (res.trips || []).filter(t => t.photoUrl).length;
      if (saved >= rows.length) break;
    } catch (err){ /* keep polling */ }
  }

  if (res && saved >= rows.length){
    TRIPS = res.trips;
    rows.forEach(r => delete SHOTS[r]);
    note.className = 'note ok';
    note.textContent = 'Saved ' + saved + ' PDFs to Drive.';
    render();
  } else if (res){
    if (saved){ TRIPS = res.trips; render(); }
    note.className = 'note err';
    if (!saved && !ACCESS_CODE){
      // Nothing saved and no code to send: the server refused every request.
      note.textContent = 'No access code. Re-scan the QR code on the computer.';
    } else if (!saved){
      note.textContent = 'Nothing saved. Your access code may have been ' +
                         'withdrawn — check with the office, or re-scan the QR.';
    } else {
      note.textContent = saved + ' of ' + rows.length +
                         ' saved. Tap Upload again for the rest.';
    }
  } else {
    note.className = 'note';
    note.textContent = 'Uploaded, but could not confirm \u2014 check the sheet.';
  }
  btn.disabled = false;
};

load();
</script>
