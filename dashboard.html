<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHI — Fleet Dashboard</title>
<link rel="icon" href="dash-favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="dash-icon-192.png">
<link rel="manifest" href="dashboard.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#232326">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#232326; --accent:#F25505; --paper:#f6f6f4; --card:#fff;
    --line:#e4e4e1; --muted:#78787c; --pos:#12855b; --neg:#c62828;
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}

  header{background:var(--card);color:var(--ink);padding:13px 22px;
         border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header img.logo{height:30px;width:auto;display:block}
  header h1{font-size:13px;font-weight:700;margin:0;letter-spacing:1.6px;
       text-transform:uppercase;padding-left:16px;border-left:1px solid var(--line)}
  header .right{margin-left:auto;display:flex;align-items:center;gap:12px;
       font-size:11px;color:var(--muted)}
  header .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);
       flex:none;transition:background .3s}
  header .dot.busy{background:var(--accent)}
  header .dot.off{background:#7a3b3b}
  @media(max-width:640px){
    header{padding:11px 14px;gap:12px}
    header img.logo{height:24px}
    header h1{font-size:11px;padding-left:12px}
    header .right{width:100%;margin-left:0;justify-content:space-between}
    main{padding:14px 12px 50px}
    .kpi span{font-size:19px}
  }
  header button{font:inherit;font-size:11px;font-weight:600;letter-spacing:.4px;
       background:#fff;color:var(--muted);border:1px solid var(--line);
       border-radius:4px;padding:5px 11px;cursor:pointer}
  header button:hover{border-color:var(--accent);color:var(--accent)}

  main{padding:20px 22px 60px;max-width:1320px;margin:0 auto}

  section{margin-bottom:26px}
  .shead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
  .shead h2{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;
       margin:0;font-weight:700}
  .shead .rule{flex:1;height:1px;background:var(--line)}
  .shead .src{font-size:10.5px;color:var(--muted);letter-spacing:.3px}

  .grid{display:grid;gap:10px;
        grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;
       padding:13px 15px 14px}
  .kpi b{display:block;font-size:9.5px;letter-spacing:.9px;color:var(--muted);
       font-weight:700;text-transform:uppercase;margin-bottom:5px;line-height:1.35}
  .kpi span{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;
       letter-spacing:-.4px}
  .pos{color:var(--pos)} .neg{color:var(--neg)}

  .charts{display:grid;gap:12px;grid-template-columns:2fr 1fr}
  @media(max-width:900px){.charts{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 17px}
  .panel h3{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;
       margin:0 0 12px;color:var(--muted);font-weight:700}
  /* Scoped to charts only. As a bare `svg{width:100%}` this also hit the
     header logo and blew it up to the full page width. */
  .panel svg{display:block;width:100%;height:auto;overflow:visible}
  header svg{flex:none}
  .axis{font-size:9px;fill:var(--muted)}
  .gline{stroke:var(--line);stroke-width:1}

  .legend{display:flex;flex-direction:column;gap:7px;margin-top:12px;font-size:12px}
  .legend div{display:flex;align-items:center;gap:8px}
  .legend i{width:9px;height:9px;border-radius:2px;flex:none}
  .legend em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums;font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);
        font-variant-numeric:tabular-nums;white-space:nowrap}
  th{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;
     color:var(--muted);font-weight:700}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:#faf9f7}
  .scroll{overflow-x:auto}

  .state{padding:70px 20px;text-align:center;color:var(--muted)}
  .state b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
  .stale{background:#fff4e5;border:1px solid #f0d9b5;border-radius:6px;
         padding:9px 13px;font-size:12px;margin-bottom:18px}

  .lockwrap{position:fixed;inset:0;background:var(--paper);z-index:60;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .lockwrap[hidden]{display:none}
  .lockbox{max-width:320px;width:100%;text-align:center}
  .lockbox .logo{height:30px;margin:0 auto 26px;display:block}
  .lockbox h2{font-size:15px;margin:0 0 6px;font-weight:600}
  .lockbox p{font-size:12px;color:var(--muted);margin:0 0 18px;min-height:34px}
  .lockbox p.err{color:var(--neg)}
  .lockbox input{width:100%;height:44px;font-size:20px;text-align:center;
       letter-spacing:6px;border:1px solid var(--line);border-radius:6px;
       margin-bottom:12px;background:#fff;font-family:inherit}
  .lockbox input:focus{outline:none;border-color:var(--accent)}
  .lockbox button{width:100%;padding:11px;font:inherit;font-weight:700;
       background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer}
  .lockbox button:disabled{opacity:.5;cursor:default}
</style>

<header>
  <img class="logo" src="logo-wordmark.png" alt="Bansal Heavy Industries">
  <h1>Dashboard</h1>
  <div class="right">
    <span class="dot" id="dot" title="Live"></span>
    <span id="stamp"></span>
    <button id="reload">Refresh</button>
  </div>
</header>

<div class="lockwrap" id="lockwrap" hidden>
  <div class="lockbox">
    <img class="logo" src="logo-wordmark.png" alt="Bansal Heavy Industries">
    <h2>Enter your access code</h2>
    <p id="lockMsg">This dashboard is restricted.</p>
    <input id="lockCode" type="text" inputmode="numeric" autocomplete="off"
           maxlength="12" placeholder="••••">
    <button id="lockGo">Unlock</button>
  </div>
</div>

<main>
  <div class="stale" id="stale" hidden></div>
  <div id="body"><div class="state"><b>Loading</b>Reading the workbook…</div></div>
</main>

<script>
/* MUST be the same /exec URL as the one in index.html. Deploying a NEW
   DEPLOYMENT (rather than a new version of the existing one) issues a fresh
   URL; the old one keeps answering from old code, which is why a mismatch
   shows up as data that loads but is wrong or incomplete rather than as a
   clean failure. */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzGSlQalJ6YgpFOkvBMNxMYML3l7nQlYIhX0ADMHoys2qXBd3xxcqRbL4va3UyQVoRJ/exec';

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const inr = v => Number(v).toLocaleString('en-IN', { maximumFractionDigits: 0 });

/* JSONP with a timeout that does not leave a landmine behind.

   The old version deleted window[cb] the moment it gave up. Apps Script cold
   starts can take longer than the timeout, so the response would arrive
   afterwards, call a function that no longer existed, and throw
   "ReferenceError: cb... is not defined" into the console. Worse, the page
   had already decided it was offline and said so while showing stale figures.

   Now: the callback is replaced by a no-op rather than deleted, the script
   tag is cleaned up late, and the window is long enough for a cold start. */
function jsonp(params){
  return new Promise((resolve, reject) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const el = document.createElement('script');

    const cleanup = () => { el.remove(); };
    const retire = () => {
      // Keep the name defined so a late reply lands harmlessly, then tidy up.
      window[cb] = () => {};
      setTimeout(() => { try { delete window[cb]; } catch(_){} }, 60000);
      cleanup();
    };

    const t = setTimeout(() => { retire(); reject(new Error('timeout')); }, 45000);
    window[cb] = d => { clearTimeout(t); retire(); resolve(d); };
    el.onerror = () => { clearTimeout(t); retire(); reject(new Error('failed')); };
    el.src = ENDPOINT + '?' + params + '&callback=' + cb +
             (ACCESS_CODE ? '&k=' + encodeURIComponent(ACCESS_CODE) : '');
    document.head.appendChild(el);
  });
}

/* A value is negative if it carries a minus sign anywhere in the display text,
   which covers "-1,200" and "(1,200)" and "-Rs 1,200" alike. */
const signClass = (label, value) => {
  if (!/profit|margin|balance/i.test(label)) return '';
  return /-|\(/.test(value) ? 'neg' : 'pos';
};

function kpiCard(label, value){
  return `<div class="kpi"><b>${esc(label)}</b>
            <span class="${signClass(label, value)}">${esc(value)}</span></div>`;
}

/* ---------- charts, hand-rolled SVG so the page carries no libraries ---------- */

function lineChart(rows, key, colour, fmt){
  if (rows.length < 2) return '<p class="axis">Not enough months yet.</p>';
  const W = 640, H = 190, L = 52, R = 12, T = 12, B = 26;
  const vals = rows.map(r => r[key]);
  const lo = Math.min(0, ...vals), hi = Math.max(...vals, 1);
  const x = i => L + i * (W - L - R) / (rows.length - 1);
  const y = v => T + (hi - v) / (hi - lo || 1) * (H - T - B);

  const ticks = [lo, lo + (hi - lo) / 2, hi];
  const grid = ticks.map(v =>
    `<line class="gline" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
     <text class="axis" x="${L - 7}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`
  ).join('');

  const line = rows.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ');
  const area = line + ` L${x(rows.length - 1).toFixed(1)},${y(Math.max(lo,0)).toFixed(1)}`
                    + ` L${x(0).toFixed(1)},${y(Math.max(lo,0)).toFixed(1)} Z`;

  const dots = rows.map((r, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(r[key]).toFixed(1)}" r="3" fill="${colour}">
       <title>${esc(r.month)}: ${fmt(r[key])}</title></circle>`).join('');

  // Only label every nth month so the axis never collides with itself.
  const step = Math.ceil(rows.length / 8);
  const labels = rows.map((r, i) => i % step ? '' :
    `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(r.month)}</text>`
  ).join('');

  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${grid}
    <path d="${area}" fill="${colour}" opacity=".08"/>
    <path d="${line}" fill="none" stroke="${colour}" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

function donut(items){
  if (!items.length) return '<p class="axis">No expenses recorded.</p>';
  const total = items.reduce((s, i) => s + i[1], 0) || 1;
  const cols = ['#F25505', '#232326', '#8a8a90', '#c9a227'];
  const C = 100, R = 74, r = 46;
  let a0 = -Math.PI / 2, paths = '';
  items.forEach((it, i) => {
    const a1 = a0 + it[1] / total * Math.PI * 2;
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const p = (rad, ang) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
    paths += `<path d="M${p(R, a0)} A${R},${R} 0 ${big} 1 ${p(R, a1)}
                       L${p(r, a1)} A${r},${r} 0 ${big} 0 ${p(r, a0)} Z"
                    fill="${cols[i % cols.length]}"><title>${esc(it[0])}: ${inr(it[1])}</title></path>`;
    a0 = a1;
  });
  const legend = items.map((it, i) =>
    `<div><i style="background:${cols[i % cols.length]}"></i>${esc(it[0])}
       <em>${(it[1] / total * 100).toFixed(0)}%</em></div>`).join('');
  return `<svg viewBox="0 0 200 200" role="img" style="max-width:200px;margin:0 auto">${paths}
    <text x="100" y="96" text-anchor="middle" class="axis" style="font-size:9px">TOTAL</text>
    <text x="100" y="112" text-anchor="middle" style="font-size:15px;font-weight:650"
          fill="#232326">${inr(total)}</text></svg>
    <div class="legend">${legend}</div>`;
}

function trendTable(rows){
  const head = ['Month','Revenue','Diesel','Repair','Fixed','Cash','Net Profit','Tonnage'];
  return `<div class="scroll"><table><thead><tr>${
    head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>
      <td>${esc(r.month)}</td><td>${inr(r.revenue)}</td><td>${inr(r.diesel)}</td>
      <td>${inr(r.repair)}</td><td>${inr(r.fixed)}</td><td>${inr(r.cash)}</td>
      <td class="${r.profit < 0 ? 'neg' : 'pos'}">${inr(r.profit)}</td>
      <td>${r.tonnage.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- render ---------- */

const isValid = d => d && !d.error && Array.isArray(d.blocks);

function render(d){
  let html = `<p style="font-size:11px;color:var(--muted);margin:0 0 14px">
      Figures calculated by the workbook at ${esc(d.generatedAt)}.</p>`;
  d.blocks.forEach(b => {
    if (!b.kpis.length) return;
    html += `<section>
      <div class="shead"><h2>${esc(b.title)}</h2><div class="rule"></div>
        <span class="src">${esc(b.source)}</span></div>
      <div class="grid">${b.kpis.map(([l, v]) => kpiCard(l, v)).join('')}</div>
    </section>`;
  });

  if (d.trend.length){
    html += `<section>
      <div class="shead"><h2>Monthly Trend</h2><div class="rule"></div>
        <span class="src">Monthly Summary (calc)</span></div>
      <div class="charts">
        <div class="panel"><h3>Net profit by month (Rs.)</h3>
          ${lineChart(d.trend, 'profit', '#F25505', v => inr(v))}</div>
        <div class="panel"><h3>Expense breakdown</h3>${donut(d.expense)}</div>
      </div>
      <div class="charts" style="margin-top:12px">
        <div class="panel"><h3>Tonnage moved by month</h3>
          ${lineChart(d.trend, 'tonnage', '#232326', v => v.toFixed(1))}</div>
        <div class="panel"><h3>Month by month</h3>${trendTable(d.trend)}</div>
      </div>
    </section>`;
  }

  document.getElementById('body').innerHTML = html ||
    '<div class="state"><b>No data yet</b>The workbook has no figures to show.</div>';
}

/* ---------- keeping it current ----------
   A dashboard left open on a phone would otherwise freeze at whatever loaded
   when it was opened. Three things keep it honest:
     1. a poll every 5 minutes while the page is actually visible
     2. an immediate refresh whenever the app is brought back to the foreground
     3. a footer clock showing how old the figures on screen really are
   Polling pauses when the page is hidden, so a backgrounded app costs nothing
   in battery or Apps Script quota. */

const POLL_MS = 5 * 60 * 1000;
let lastLoaded = 0, timer = null;

/* ---------- access ----------
   Same roster as the entry form, but this page requires a code whose Role is
   'Dashboard' or 'Overall'. An entry-only code is refused, so the person
   filling in trips cannot read revenue and profit here.

   Fail closed: if the workbook cannot be reached the page stays locked. */
let ACCESS_CODE = localStorage.getItem('bhi_dash_code') || '';
let AUTH_ERROR = '';

const LOCK_TEXT = {
  revoked:     'Your access has been withdrawn. Contact the office if you '
             + 'think this is a mistake.',
  unknown:     'That code was not recognised.',
  wrongrole:   'Your access no longer covers the dashboard.',
  missing:     'This dashboard is restricted.',
  notab:       'Access list not found in the workbook.',
  unavailable: 'Cannot reach the workbook, so your code cannot be checked.',
  offline:     'No connection to the workbook, so your code cannot be checked. '
             + 'Try again shortly.'
};

function lock(reason){
  const w = document.getElementById('lockwrap');
  const m = document.getElementById('lockMsg');
  if (reason){
    m.textContent = LOCK_TEXT[reason] || String(reason);
    m.className = (reason === 'missing') ? '' : 'err';
  }
  w.hidden = false;
  document.getElementById('body').innerHTML = '';   // nothing readable behind it
  clearTimeout(timer);
  const i = document.getElementById('lockCode');
  i.value = '';
  setTimeout(() => i.focus(), 50);
}

document.getElementById('lockGo').onclick = async () => {
  const i = document.getElementById('lockCode');
  const m = document.getElementById('lockMsg');
  const code = i.value.trim();
  if (!code) return;
  m.className = ''; m.textContent = 'Checking\u2026';
  ACCESS_CODE = code;
  await load();
  if (AUTH_ERROR){
    lock(AUTH_ERROR);            // load() has already cleared the code
  } else if (!lastLoaded){
    ACCESS_CODE = '';
    lock('offline');
  } else {
    localStorage.setItem('bhi_dash_code', code);
    document.getElementById('lockwrap').hidden = true;
  }
};

document.getElementById('lockCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('lockGo').click();
});

function setDot(state){
  const d = document.getElementById('dot');
  d.className = 'dot' + (state ? ' ' + state : '');
  d.title = state === 'busy' ? 'Refreshing' : state === 'off' ? 'Offline' : 'Live';
}

function ageText(){
  if (!lastLoaded) return '';
  const m = Math.round((Date.now() - lastLoaded) / 60000);
  return m < 1 ? 'just now' : m === 1 ? '1 min ago' : m + ' min ago';
}

function tickStamp(){
  const el = document.getElementById('stamp');
  if (lastLoaded) el.textContent = 'Updated ' + ageText();
}
setInterval(tickStamp, 30000);

function schedule(){
  clearTimeout(timer);
  if (document.visibilityState === 'visible') timer = setTimeout(load, POLL_MS);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { clearTimeout(timer); return; }
  // Back in the foreground: anything older than a minute is worth re-reading.
  if (Date.now() - lastLoaded > 60000) load(); else schedule();
});

async function load(){
  const stale = document.getElementById('stale');
  const btn = document.getElementById('reload');
  btn.disabled = true;
  setDot('busy');
  try {
    const d = await jsonp('action=dash');

    if (d && d.authError){
      // Enforced here so every path locks: first load, the Refresh button and
      // the five-minute poll. Revoking, or narrowing a role to Data entry,
      // shuts an already-open dashboard on its next contact with the sheet.
      AUTH_ERROR = d.authError;
      localStorage.removeItem('bhi_dash');        // never keep figures we cannot show
      localStorage.removeItem('bhi_dash_code');
      ACCESS_CODE = '';
      lastLoaded = 0;
      btn.disabled = false;
      lock(AUTH_ERROR);
      return;
    }
    AUTH_ERROR = '';

    // The endpoint answers even when it cannot build a dashboard — for
    // example if Dashboard.gs is missing from the Apps Script project, or the
    // deployment is an older version. Caching that reply would poison every
    // later load, so check the shape before trusting it.
    if (!isValid(d)) {
      // A reply carrying `summary`/`lists` but no `blocks` is the signature of
      // an endpoint still serving a deployment from before action=dash existed.
      if (d && (d.summary || d.lists)) {
        throw new Error('This endpoint is running an older deployment. Copy the ' +
                        'ENDPOINT value out of index.html into dashboard.html, ' +
                        'or redeploy a NEW VERSION of the existing deployment.');
      }
      throw new Error(d && d.error ? d.error : 'unexpected reply from the endpoint');
    }

    localStorage.setItem('bhi_dash', JSON.stringify(d));
    lastLoaded = Date.now();
    stale.hidden = true;
    setDot('');
    render(d);
    tickStamp();
  } catch (err){
    setDot('off');
    let cached = null;
    try {
      const raw = localStorage.getItem('bhi_dash');
      const parsed = raw ? JSON.parse(raw) : null;
      if (isValid(parsed)) cached = parsed;
      else localStorage.removeItem('bhi_dash');   // drop a poisoned entry
    } catch (_){ localStorage.removeItem('bhi_dash'); }

    if (cached){
      stale.hidden = false;
      stale.textContent = 'Could not reach the workbook — showing the last figures loaded on this device ('
                          + cached.generatedAt + ').';
      render(cached);
    } else {
      stale.hidden = true;
      document.getElementById('body').innerHTML =
        '<div class="state"><b>Could not load the dashboard</b>' +
        esc(String(err.message || err)) +
        '<br><br><span style="font-size:11px">Endpoint in use:<br>' +
        esc(ENDPOINT.slice(0, 62)) + '…</span></div>';
    }
  }
  btn.disabled = false;
  schedule();
}

document.getElementById('reload').onclick = load;

(async () => {
  if (!ACCESS_CODE){ lock('missing'); return; }
  await load();
  if (AUTH_ERROR){
    lock(AUTH_ERROR);            // load() has already cleared the code
  } else if (!lastLoaded){
    lock('offline');          // could not verify: locked, per fail-closed rule
  }
})();
</script>
